[package]
name = "atomic-movegen"
version = "2.10.0"
edition = "2024"
description = "Legal move generation for atomic chess."
readme = "README.md"
keywords = ["chess", "movegen", "perft"]
license = "MIT"
repository = "https://github.com/golmman/atomic_movegen"
documentation = "https://docs.rs/atomic-movegen"
categories = ["game-development", "games"]
rust-version = "1.85"
include = [
    "/src/**/*.rs",
    "/tests/**/*.rs",
    "/tests/*.md",
    "/tests/data/*.tsv",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
unsafe-optimizations = []

[dependencies]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
debug = false
incremental = false
overflow-checks = false

[profile.profiling]
inherits = "release"
debug = 2
strip = false
